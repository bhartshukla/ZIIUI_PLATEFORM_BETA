<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ziiui — AI Editor</title>
<meta name="theme-color" content="#0c0e12">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: hidden }
  .ai-page { display: grid; grid-template-rows: auto auto 1fr; height: 100dvh }
  .ai-page-head {
    display: flex; align-items: center; gap: .75rem;
    padding: .8rem 1.1rem; border-bottom: 1px solid var(--line);
    background: var(--raise); flex-wrap: wrap
  }
  .ai-page-head h1 { margin: 0; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: .5rem }
  .ai-page-head h1 i { color: var(--acc) }
  .ai-page-head .meta { font-size: .78rem; color: var(--mute); flex: 1; min-width: 0 }
  .ai-page-body {
    display: grid; grid-template-columns: 360px minmax(0, 1fr) minmax(0, 1fr);
    min-height: 0; overflow: hidden
  }
  .ai-page-col {
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    border-right: 1px solid var(--line)
  }
  .ai-page-col:last-child { border-right: 0 }
  .ai-col-head {
    padding: .55rem .85rem; font-size: .68rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--mute);
    border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; justify-content: space-between; gap: .5rem
  }
  .ai-page-col .ai-msgs { flex: 1; padding: .85rem }
  .ai-page-col .ai-input { border-top: 1px solid var(--line) }
  @media (max-width: 1100px) {
    .ai-page-body { grid-template-columns: minmax(0, 1fr) }
    .ai-page-col { border-right: 0; border-bottom: 1px solid var(--line) }
    .ai-page-body { overflow-y: auto }
  }
</style>
</head>
<body>

<div class="ai-page">
  <header class="ai-page-head">
    <h1><i class="ri-sparkling-2-line"></i> ziiui AI Editor</h1>
    <span class="meta" id="aiHeadSub">Loading…</span>
    <a class="ai-btn ghost" href="index.html"><i class="ri-arrow-left-line"></i> Back to library</a>
    <a class="ai-btn ghost" href="context.html"><i class="ri-database-2-line"></i> Context viewer</a>
  </header>

  <div class="ai-lock-banner" id="aiLockBanner" hidden role="status" aria-live="polite">
    <i class="ri-loader-4-line ai-spin" aria-hidden="true"></i>
    <span class="ai-lock-text">AI is working… Editing is temporarily locked.</span>
    <button class="ai-btn ghost ai-btn-mini" id="aiCancelRequest" type="button">Cancel</button>
  </div>

  <div class="ai-page-body">
    <section class="ai-page-col">
      <div class="ai-col-head">
        <span>Conversation</span>
        <span class="ai-context-text" id="aiContextText">New AI session</span>
      </div>
      <div class="ai-msgs" id="aiMsgs" role="log" aria-live="polite" aria-label="AI conversation"></div>
      <div class="ai-input">
        <label class="sr" for="aiPrompt">Tell AI what you want to change</label>
        <textarea id="aiPrompt" rows="2" placeholder="Tell AI what you want to change…"
          spellcheck="false" autocomplete="off"></textarea>
        <div class="ai-actions">
          <span class="ai-hint">Enter to send · Shift + Enter for a new line</span>
          <button class="ai-btn primary" id="aiSend" type="button">
            <i class="ri-sparkling-line" aria-hidden="true"></i> Generate
          </button>
        </div>
      </div>
    </section>

    <section class="ai-page-col">
      <div class="ai-col-head">
        <span>Code editor</span>
        <label class="ai-auto"><input type="checkbox" id="aiAutoPreview"> Auto preview</label>
      </div>
      <textarea class="ai-code" id="aiCodeEditor" spellcheck="false" autocomplete="off"
        aria-label="Edited component code" style="height:100%"></textarea>
    </section>

    <section class="ai-page-col">
      <div class="ai-col-head"><span>Live preview</span></div>
      <iframe class="ai-preview-frame" id="aiPreviewFrame" title="AI edited component preview"
        sandbox="allow-scripts" style="height:100%"></iframe>
    </section>
  </div>
</div>

<div class="ai-modal" id="aiModal" hidden role="dialog" aria-modal="true">
  <div class="ai-modal-box" style="display:none"></div>
</div>

<input type="file" id="importFile" hidden>

<div id="status" class="sr" role="status" aria-live="polite"></div>

<script src="ai.js"></script>
</body>
</html>
