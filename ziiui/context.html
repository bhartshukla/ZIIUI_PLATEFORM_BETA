<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ziiui — AI Context</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ziiui-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.setAttribute('data-theme', 'light');
      } catch (_) { }
    })();
  </script>
</head>
<body>

<header>
  <h1><i class="ri-chat-history-line" aria-hidden="true"></i> ziiui — AI Context</h1>
  <div class="toolbar">
    <a class="btn" href="index.html"><i class="ri-arrow-left-line" aria-hidden="true"></i> Library</a>
    <a class="btn" href="ai.html"><i class="ri-sparkling-2-line" aria-hidden="true"></i> AI Editor</a>
    <button class="btn" id="refreshBtn" type="button"><i class="ri-refresh-line" aria-hidden="true"></i> Refresh</button>
    <button class="btn" id="themeBtn" type="button"><i class="ri-moon-line" aria-hidden="true"></i> Theme</button>
    <button class="btn danger" id="clearAllBtn" type="button"><i class="ri-delete-bin-6-line" aria-hidden="true"></i> Clear History</button>
  </div>
</header>

<main>
  <div class="notice" id="emptyNotice" hidden>
    <i class="ri-information-line" aria-hidden="true"></i>
    No saved AI conversations yet. Open a component in the library or the AI Editor to start chatting.
  </div>

  <div class="layout" id="layout" hidden>
    <section class="card">
      <div class="card-head"><i class="ri-chat-3-line" aria-hidden="true"></i> Conversations</div>
      <ul class="comp-list" id="compList"></ul>
    </section>

    <section class="card" id="detailCard" hidden>
      <div class="card-head detail-head">
        <div class="detail-title">
          <i class="ri-sparkling-2-line" aria-hidden="true"></i>
          <span id="detailCompName">Component</span>
        </div>
        <a class="btn primary" id="openInEditorBtn" href="#">
          <i class="ri-edit-line" aria-hidden="true"></i> Continue in AI Editor
        </a>
      </div>

      <div class="chat-container">
        <div class="chat-stream" id="chatMsgs" role="log" aria-label="Conversation history"></div>
        <div class="empty" id="chatEmpty" hidden>No conversation messages yet for this component.</div>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/src/pages/context.js"></script>
</body>
</html>
