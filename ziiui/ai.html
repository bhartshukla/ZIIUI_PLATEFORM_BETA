<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ziiui — AI Editor</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css">

  <script>
    /* Apply the saved theme before first paint (prevents a flash). */
    (function () {
      try {
        var saved = localStorage.getItem('ziiui-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.setAttribute('data-theme', 'light');
      } catch (_) { }
    })();
  </script>

  <!-- Critical shell CSS before first paint — prevents unstyled flash before module loads -->
  <style id="critical-css">
    html { overflow-x: hidden; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
    }
    [hidden] { display: none !important }
    [class^="ri-"], [class*=" ri-"] {
      font-family: 'remixicon' !important;
      font-style: normal;
    }
    .ai-page {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }
    .ai-page-head {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1.1rem;
      border-bottom: 1px solid var(--line);
      background: var(--header-bg);
    }
    .ai-page-head h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }
    .ai-page-head .meta {
      font-size: .8rem;
      color: var(--mute);
    }
    .ai-page-head a.ai-btn.ghost {
      color: var(--mute);
      text-decoration: none;
      font-size: .85rem;
      padding: .45rem .7rem;
      border-radius: 8px;
    }
    .ai-page-head a.ai-btn.ghost:hover {
      background: var(--raise);
      color: var(--fg);
    }
    .ai-lock-banner {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem .85rem;
      background: var(--acc-soft);
      border-bottom: 1px solid var(--acc-line);
      color: var(--acc);
      font-size: .74rem;
      font-weight: 600;
    }
    .ai-page-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1rem;
      padding: 1.1rem;
      min-width: 0;
    }
    .ai-page-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .ai-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-bottom: .5rem;
    }
    .ai-msgs {
      flex: 1;
      overflow-y: auto;
      padding: .8rem .85rem;
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }
    .ai-msg {
      max-width: 92%;
      padding: .55rem .7rem;
      border-radius: 10px;
      font-size: .8rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .ai-msg.user {
      align-self: flex-end;
      background: var(--acc);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .ai-msg.ai {
      align-self: flex-start;
      background: var(--raise);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    .ai-input {
      border-top: 1px solid var(--line);
      padding: .65rem .85rem .75rem;
      display: grid;
      gap: .5rem;
      background: var(--panel);
    }
    .ai-input textarea {
      min-height: 54px;
      max-height: 140px;
      resize: vertical;
      font-size: .82rem;
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .ai-actions {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .ai-hint {
      font-size: .68rem;
      color: var(--mute);
      line-height: 1.35;
    }
    .ai-btn {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: .5rem .8rem;
      font: inherit;
      font-size: .8rem;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      min-height: 38px;
      line-height: 1;
    }
    .ai-btn.primary {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
    }
    .ai-btn.ghost {
      background: transparent;
    }
    .ai-btn i {
      font-size: 1.1rem;
      line-height: 1;
    }
  </style>
  <link rel="stylesheet" href="/src/styles/style.css">
  <link rel="stylesheet" href="/src/styles/ai-editor.css">
</head>

<body>

  <div class="ai-page">
    <header class="ai-page-head">
      <h1><i class="ri-sparkling-2-line"></i> ziiui AI Editor</h1>
      <span class="meta" id="aiHeadSub">Loading…</span>
      <label class="sr" for="aiComponentSelect">Component</label>
      <select class="ai-picker" id="aiComponentSelect" hidden></select>
      <a class="ai-btn ghost" href="index.html"><i class="ri-arrow-left-line"></i> Back to library</a>
      <a class="ai-btn ghost" href="context.html"><i class="ri-database-2-line"></i> Context viewer</a>
    </header>

    <div class="ai-lock-banner" id="aiLockBanner" hidden role="status" aria-live="polite">
      <i class="ri-loader-4-line ai-spin" aria-hidden="true"></i>
      <span class="ai-lock-text">AI is working… Editing is temporarily locked.</span>
      <button class="ai-btn ghost ai-btn-mini" id="aiCancelRequest" type="button"><i class="ri-close-line"
          aria-hidden="true"></i> Cancel</button>
    </div>

    <div class="ai-page-body">
      <section class="ai-page-col">
        <div class="ai-col-head">
          <span>Conversation</span>
          <span class="ai-context-text" id="aiContextText">New AI session</span>
        </div>
        <div class="ai-msgs" id="aiMsgs" role="log" aria-live="polite" aria-label="AI conversation"></div>
        <div class="ai-input">
          <label class="sr" for="aiPrompt">Tell AI what you want to change</label>
          <textarea id="aiPrompt" rows="2" placeholder="Tell AI what you want to change…" spellcheck="false"
            autocomplete="off"></textarea>
          <div class="ai-actions">
            <span class="ai-hint">Enter to send · Shift + Enter for a new line</span>
            <button class="ai-btn primary" id="aiSend" type="button">
              <i class="ri-sparkling-line" aria-hidden="true"></i> Generate
            </button>
          </div>
        </div>
      </section>

      <section class="ai-page-col">
        <div class="ai-col-head">
          <span>Code editor</span>
          <span class="ai-col-actions">
            <button class="ai-btn ghost ai-btn-mini" id="aiResetBtn" type="button"
              title="Discard AI edits and restore the original code"><i class="ri-arrow-go-back-line"
                aria-hidden="true"></i> Reset</button>
            <button class="ai-btn ghost ai-btn-mini" id="aiCopyBtn" type="button"><i class="ri-file-copy-line"
                aria-hidden="true"></i> Copy</button>
            <button class="ai-btn ghost ai-btn-mini" id="aiExportBtn" type="button" title="Export HTML file"><i class="ri-download-2-line"
                aria-hidden="true"></i> Export</button>
            <label class="ai-auto"><input type="checkbox" id="aiAutoPreview"> Auto preview</label>
          </span>
        </div>
        <textarea class="ai-code" id="aiCodeEditor" spellcheck="false" autocomplete="off"
          aria-label="Edited component code" style="height:100%"></textarea>
      </section>

      <section class="ai-page-col">
        <div class="ai-col-head"><span>Live preview</span></div>
        <iframe class="ai-preview-frame" id="aiPreviewFrame" title="AI edited component preview" sandbox="allow-scripts"
          style="height:100%"></iframe>
      </section>
    </div>
  </div>

  <div id="status" class="sr" role="status" aria-live="polite"></div>

  <script type="module" src="/src/pages/ai-editor.js"></script>
</body>

</html>
