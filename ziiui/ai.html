<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ziiui — AI Editor</title>
<meta name="theme-color" content="#0c0e12">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">

<script>
    /* Apply the saved theme before first paint (prevents a flash). */
    (function () {
      try {
        var saved = localStorage.getItem('ziiui-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.setAttribute('data-theme', 'light');
      } catch (_) { }
    })();
  </script>
</head>
<body>

<div class="ai-page">
  <header class="ai-page-head">
    <h1><i class="ri-sparkling-2-line"></i> ziiui AI Editor</h1>
    <span class="meta" id="aiHeadSub">Loading…</span>
    <label class="sr" for="aiComponentSelect">Component</label>
    <select class="ai-picker" id="aiComponentSelect" hidden></select>
    <a class="ai-btn ghost" href="index.html"><i class="ri-arrow-left-line"></i> Back to library</a>
    <a class="ai-btn ghost" href="context.html"><i class="ri-database-2-line"></i> Context viewer</a>
  </header>

  <div class="ai-lock-banner" id="aiLockBanner" hidden role="status" aria-live="polite">
    <i class="ri-loader-4-line ai-spin" aria-hidden="true"></i>
    <span class="ai-lock-text">AI is working… Editing is temporarily locked.</span>
    <button class="ai-btn ghost ai-btn-mini" id="aiCancelRequest" type="button"><i class="ri-close-line" aria-hidden="true"></i> Cancel</button>
  </div>

  <div class="ai-page-body">
    <section class="ai-page-col">
      <div class="ai-col-head">
        <span>Conversation</span>
        <span class="ai-context-text" id="aiContextText">New AI session</span>
      </div>
      <div class="ai-msgs" id="aiMsgs" role="log" aria-live="polite" aria-label="AI conversation"></div>
      <div class="ai-input">
        <label class="sr" for="aiPrompt">Tell AI what you want to change</label>
        <textarea id="aiPrompt" rows="2" placeholder="Tell AI what you want to change…"
          spellcheck="false" autocomplete="off"></textarea>
        <div class="ai-actions">
          <span class="ai-hint">Enter to send · Shift + Enter for a new line</span>
          <button class="ai-btn primary" id="aiSend" type="button">
            <i class="ri-sparkling-line" aria-hidden="true"></i> Generate
          </button>
        </div>
      </div>
    </section>

    <section class="ai-page-col">
      <div class="ai-col-head">
        <span>Code editor</span>
        <span class="ai-col-actions">
          <button class="ai-btn ghost ai-btn-mini" id="aiResetBtn" type="button" title="Discard AI edits and restore the original code"><i class="ri-arrow-go-back-line" aria-hidden="true"></i> Reset</button>
          <button class="ai-btn ghost ai-btn-mini" id="aiCopyBtn" type="button"><i class="ri-file-copy-line" aria-hidden="true"></i> Copy</button>
          <label class="ai-auto"><input type="checkbox" id="aiAutoPreview"> Auto preview</label>
        </span>
      </div>
      <textarea class="ai-code" id="aiCodeEditor" spellcheck="false" autocomplete="off"
        aria-label="Edited component code" style="height:100%"></textarea>
    </section>

    <section class="ai-page-col">
      <div class="ai-col-head"><span>Live preview</span></div>
      <iframe class="ai-preview-frame" id="aiPreviewFrame" title="AI edited component preview"
        sandbox="allow-scripts" style="height:100%"></iframe>
    </section>
  </div>
</div>

<div id="status" class="sr" role="status" aria-live="polite"></div>

<script type="module" src="/src/pages/ai-editor.js"></script>
</body>
</html>
