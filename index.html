<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text Effects Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0e12'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' fill='%238ab4ff'%3EA%3C/text%3E%3C/svg%3E">
      <link rel="stylesheet" href="style.css">
   
</head>

<body>
    <div class="app">
        <aside>
            <h1>Text effects lab</h1>
            <p>Pick an effect, tweak it, then copy only that code.</p>
            <nav id="nav" aria-label="Effects"></nav>
        </aside>
        <main>
            <div class="stage"><iframe id="frame" title="Effect preview" sandbox="allow-scripts"></iframe></div>
            <div class="bar">
                <div id="opts" class="bar" hidden>
                    <label>Split by
                        <select id="per">
                            <option>char</option>
                            <option>word</option>
                            <option>line</option>
                        </select>
                    </label>
                    <label>Preset
                        <select id="preset">
                            <option>fade</option>
                            <option>blur</option>
                            <option>fade-in-blur</option>
                            <option>scale</option>
                            <option>slide</option>
                        </select>
                    </label>
                </div>
                <label class="grow">Text
                    <textarea id="text" rows="3" spellcheck="false" autocomplete="off"
                        aria-describedby="hint"></textarea>
                </label>
                <button class="b" id="replay" type="button" aria-label="Replay animation">Replay</button>
            </div>
            <div id="hint"></div>
            <div>
                <div class="head"><span id="label"></span><button class="b" id="copy" type="button"
                        aria-label="Copy code">Copy code</button></div>
                <pre tabindex="0" role="region" aria-label="Generated code"><code id="code"></code></pre>
            </div>
            <div id="status" class="sr" role="status" aria-live="polite"></div>
        </main>
    </div>

    <!--
      Code templates for the generated pages. They are inert text/plain blocks (never executed),
      so they need no escaping. Placeholders look like @@NAME@@ and are filled by fill() below.
    -->

    <script type="text/plain" id="t-base-css">
body {
  margin: 0; min-height: 100vh; display: flex; padding: 1rem; box-sizing: border-box;
  background: #0f1115; color: #f2f2f0; font-family: system-ui, sans-serif; text-align: center;
}
#t { margin: auto; max-width: 100%; line-height: 1.2; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; }
    </script>

    <script type="text/plain" id="t-wcss">
.w { display: inline-block; white-space: pre-wrap; }
    </script>

    <script type="text/plain" id="t-wrap">
const el = document.getElementById('t');
const text = el.textContent;

// Skip the animation for visitors who prefer reduced motion.
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  el.textContent = '';
@@BODY@@
}
    </script>

    <script type="text/plain" id="t-graphemes">
const graphemes = s => window.Intl && Intl.Segmenter
  ? Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s), x => x.segment)
  : Array.from(s);
    </script>

    <script type="text/plain" id="t-build">
// Keeps each word together; whitespace stays plain text so spacing is preserved.
function build(el, text, make) {
  let i = 0;
  text.split(/(\s+)/).forEach(part => {
    if (!part) return;
    if (/^\s+$/.test(part)) { el.append(part); return; }
    const w = document.createElement('span');
    w.className = 'w';
    graphemes(part).forEach(ch => w.append(make(ch, i++)));
    el.append(w);
  });
  return i;
}
    </script>

    <script type="text/plain" id="t-split-char">
build(el, text, (ch, i) => {
  const s = document.createElement('span');
  s.className = 'u';
  s.style.setProperty('--i', i);
  s.textContent = ch;
  return s;
});
    </script>

    <script type="text/plain" id="t-split-word">
let i = 0;
text.split(/(\s+)/).forEach(part => {
  if (!part) return;
  if (/^\s+$/.test(part)) { el.append(part); return; }
  const s = document.createElement('span');
  s.className = 'u';
  s.style.setProperty('--i', i++);
  s.textContent = part;
  el.append(s);
});
    </script>

    <script type="text/plain" id="t-split-line">
text.split('\n').forEach((part, i) => {
  const s = document.createElement('span');
  s.className = 'u';
  s.style.setProperty('--i', i);
  s.textContent = part;
  el.append(s);
});
    </script>

    <script type="text/plain" id="t-tail">
requestAnimationFrame(() => requestAnimationFrame(() => {
  el.querySelectorAll('.u').forEach(u => u.classList.add('on'));
}));
    </script>

    <script type="text/plain" id="t-effect-css">
#t { font-size: clamp(1.4rem, 6vw, 2.6rem); font-weight: 600; letter-spacing: -.02em; }
@@WCSS@@.u {
  display: @@DISPLAY@@; white-space: pre-wrap;@@MINH@@
  @@HIDDEN@@
  transition: @@TRANS@@;
  transition-delay: calc(var(--i) * @@STAG@@s);
}
.u.on { @@SHOWN@@ }
    </script>

    <script type="text/plain" id="t-fancy-css">
#t { font-size: clamp(1.4rem, 6vw, 2.6rem); font-weight: 600; letter-spacing: -.02em; }
#t span { display: inline-block; white-space: pre-wrap; }
    </script>

    <script type="text/plain" id="t-fancy-js">
const rnd = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
let i = 0;
text.split(/(\s+)/).forEach(part => {
  if (!part) return;
  if (/^\s+$/.test(part)) { el.append(part); return; }
  const s = document.createElement('span');
  s.textContent = part;
  el.append(s);
  if (!s.animate) return;
  s.animate([
    { opacity: 0, color: rnd(), transform: 'translateY(' + (Math.random() * 100 - 50) + 'px) rotate(' + (Math.random() * 90 - 45) + 'deg) scale(.3)' },
    { opacity: 1, color: rnd(), transform: 'none' }
  ], { duration: 700, delay: i++ * 50, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'both' });
});
    </script>

    <script type="text/plain" id="t-roll-css">
#t { font-size: clamp(1.4rem, 6vw, 2.6rem); font-weight: 600; letter-spacing: -.02em; }
@@WCSS@@
.c { position: relative; display: inline-block; overflow: hidden; vertical-align: top; white-space: pre; }
.c i { display: block; font-style: normal; transition: transform @@DUR@@s @@EASE@@; }
.c i:first-child { transform: none; }
.c i + i { position: absolute; left: 0; top: 0; transform: translateY(@@FROM@@); }
.go .c i:first-child { transform: translateY(@@TO@@); }
.go .c i + i { transform: none; }
    </script>

    <script type="text/plain" id="t-roll-js">
build(el, text, (ch, i) => {
  const c = document.createElement('span');
  const a = document.createElement('i');
  const b = document.createElement('i');
  c.className = 'c';
  a.textContent = b.textContent = ch;
  a.style.transitionDelay = (i * @@A@@) + 's';
  b.style.transitionDelay = (i * @@A@@ + @@B@@) + 's';
  c.append(a, b);
  return c;
});
requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('go')));
    </script>

    <script type="text/plain" id="t-scramble-css">
#t { font-family: ui-monospace, Menlo, monospace; font-size: clamp(1.1rem, 5vw, 1.7rem); text-transform: uppercase; letter-spacing: .05em; }
    </script>

    <script type="text/plain" id="t-scramble-js">
const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
const chars = graphemes(text);
const total = Math.round(1 / 0.03);
let step = 0;
let timer = null;
const stop = () => { clearInterval(timer); timer = null; };
const tick = () => {
  step++;
  const done = Math.floor(chars.length * step / total);
  el.textContent = chars.map((c, i) =>
    /\s/.test(c) || i < done ? c : glyphs[Math.floor(Math.random() * glyphs.length)]
  ).join('');
  if (step >= total) { stop(); el.textContent = text; }
};
stop();
tick();
timer = setInterval(tick, 30);
window.addEventListener('pagehide', stop);
    </script>

    <script type="text/plain" id="t-shimmer-css">
#t {
  font-family: ui-monospace, Menlo, monospace; font-size: clamp(1.1rem, 5vw, 1.7rem); color: transparent;
  background: linear-gradient(90deg, #0000 calc(50% - 16px), #fff, #0000 calc(50% + 16px)), #71717a;
  background-size: 250% 100%, auto;
  background-repeat: no-repeat, padding-box;
  -webkit-background-clip: text; background-clip: text;
  animation: shimmer 1s linear infinite;
}
@keyframes shimmer {
  from { background-position: 100% center; }
  to   { background-position: 0% center; }
}
@media (prefers-reduced-motion: reduce) {
  #t { animation: none; background: none; color: #f2f2f0; }
}
    </script>

    <script type="text/plain" id="t-wave-css">
#t { font-size: clamp(1.3rem, 6vw, 2.4rem); font-weight: 600; perspective: 500px; }
@@WCSS@@
#t .w span { display: inline-block; white-space: pre; color: @@BASE@@; }
    </script>

    <script type="text/plain" id="t-wave-js">
const dur = 1000;
const at = (z, s, r, c) => ({
  transform: 'translateZ(' + z + 'px) scale(' + s + ') rotateY(' + r + 'deg)', color: c
});
build(el, text, ch => {
  const s = document.createElement('span');
  s.textContent = ch;
  return s;
});
const spans = el.querySelectorAll('.w span');
spans.forEach((s, i) => {
  if (!s.animate) return;
  s.animate(
    [at(0, 1, 0, '@@BASE@@'), at(@@Z@@, @@S@@, @@R@@, '@@GRAD@@'), at(0, 1, 0, '@@BASE@@')],
    { duration: dur, delay: i * dur / Math.max(spans.length, 1), iterations: Infinity, easing: 'ease-in-out' }
  );
});

      <script src="scrpt.js"></script>
</body>

</html>
