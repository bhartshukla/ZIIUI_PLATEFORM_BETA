            /* ---------- Scroll ---------- */
            {
                id: 'listreveal', name: 'List Reveal', cat: 'Scroll', field: 'none',
                previewSize: 'large',
                note: 'Pinned list with image preview', text: '',
                code: () => fullPage(tpl('t-list-css'), tpl('t-list-html'), tpl('t-list-js'), [
                    '<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">',
                    '<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js">' + closeTag('script'),
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">' + closeTag('script'),
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js">' + closeTag('script')
                ])
            },
            {
                id: 'scrolldown', name: 'Scroll Stand', cat: 'Scroll', field: 'none',
                previewSize: 'large',
                note: '3D cards rise on scroll', text: '',
                code: () => fullPage(tpl('t-scrolldown-css'), tpl('t-scrolldown-html'), tpl('t-scrolldown-js'), [
                    '<link rel="preconnect" href="https://fonts.googleapis.com">',
                    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
                    '<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">',
                    '<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js">' + closeTag('script'),
                    '<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js">' + closeTag('script'),
                    '<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js">' + closeTag('script'),
                    '<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js">' + closeTag('script')
                ])
            },
            {
                id: 'scrollmask', name: 'Scrolling Mask', cat: 'Scroll', field: 'none',
                previewSize: 'large',
                note: 'Video revealed through scrolling text', text: '',
                code: () => fullPage(tpl('t-scrollmask-css'), tpl('t-scrollmask-html'), tpl('t-scrollmask-js'), [
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js">' + closeTag('script'),
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js">' + closeTag('script')
                ])
            },
            {
                id: 'pinrotate', name: 'Pin Rotate Sections', cat: 'Scroll', field: 'none',
                previewSize: 'large',
                note: 'Pinned cards rotate into view', text: '',
                code: () => fullPage(tpl('t-pinrotate-css'), tpl('t-pinrotate-html'), tpl('t-pinrotate-js'), [
                    '<link rel="preconnect" href="https://fonts.googleapis.com">',
                    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
                    '<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">',
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js">' + closeTag('script'),
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js">' + closeTag('script'),
                    '<script src="https://unpkg.com/lenis@1.3.15/dist/lenis.min.js">' + closeTag('script')
                ])
            },
            {
                id: 'imageflow', name: 'Images Flow', cat: 'Scroll', field: 'none',
                previewSize: 'large',
                note: '3D image flythrough on scroll', text: '',
                code: () => fullPage(tpl('t-imageflow-css'), tpl('t-imageflow-html'), tpl('t-imageflow-js'), [
                    '<link rel="preconnect" href="https://fonts.googleapis.com">',
                    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
                    '<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;600&display=swap" rel="stylesheet">',
                    '<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">',
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js">' + closeTag('script'),
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js">' + closeTag('script'),
                    '<script src="https://unpkg.com/lenis@1.3.15/dist/lenis.min.js">' + closeTag('script')
                ])
            },
            {
                id: 'clipreveal', name: 'Clip Path Reveal', cat: 'Scroll', field: 'none',
                previewSize: 'large',
                note: 'Full-screen panels reveal on scroll', text: '',
                code: () => fullPage(tpl('t-clipreveal-css'), tpl('t-clipreveal-html'), tpl('t-clipreveal-js'), [
                    '<link rel="preconnect" href="https://fonts.googleapis.com">',
                    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
                    '<link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@300;400;500;600;700&family=Outfit:wght@200;300;400&family=DM+Mono:wght@300&display=swap" rel="stylesheet">',
                    '<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js">' + closeTag('script'),
                    '<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js">' + closeTag('script'),
                    '<script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js">' + closeTag('script')
                ])
            },

            /* ---------- Shader ---------- */
            {
                id: 'noisypixel', name: 'Noisy Pixel', cat: 'Shader', field: 'none',
                previewSize: 'large',
                note: 'WebGL pixel dissolve reveal', text: '',
                code: () => fullPage(tpl('t-noisy-css'), tpl('t-noisy-html'), tpl('t-noisy-js'), [
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">' + closeTag('script'),
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">' + closeTag('script'),
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js">' + closeTag('script')
                ])
            },
            {
                id: 'mirror', name: 'Mirror Effect', cat: 'Shader', field: 'none',
                previewSize: 'large',
                note: 'Sobel-edge dissolve between two images', text: '',
                code: () => fullPage(tpl('t-mirror-css'), tpl('t-mirror-html'), tpl('t-mirror-js'), [
                    '<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">' + closeTag('script')
                ])
            }
        ];

        const CATS = ['Text', 'Cursor', 'Interactive', 'Scroll', 'Shader'];
        const FIELD = { cursor1: 'Cursor label', cursor2: 'Cursor tag', cursor3: 'Caption text' };
        EFFECTS.forEach(e => {
            if (!e.cat) e.cat = e.id.indexOf('cursor') === 0 ? 'Cursor' : 'Text';
            if (!e.previewSize) e.previewSize = 'compact';
        });

        function updatePreviewHeight(effect) {
            const frame = $('frame');
            if (!frame) return;
            frame.classList.remove('preview-compact', 'preview-large');
            frame.classList.add(effect.previewSize === 'large' ? 'preview-large' : 'preview-compact');
        }

        let cur = EFFECTS[0], html = '', buildTimer = null, nonce = 0,
            dirty = false, copyBusy = false, copyReset = null;

        const say = msg => {
            $('status').textContent = '';
            setTimeout(() => { $('status').textContent = msg; }, 30);
        };

        function rebuild() {
            clearTimeout(buildTimer);
            buildTimer = null;
            try {
                const raw = norm($('text').value);
                const empty = !raw.trim();
                const gen = cur.opts ? cur.code($('per').value, $('preset').value) : cur.code();
                html = gen.replace('__TEXT__', () => esc(empty ? PLACEHOLDER : raw));
                $('code-out').textContent = html;
                $('label').textContent = cur.name + (cur.opts
                    ? ' \u00b7 ' + $('per').value + ' \u00b7 ' + $('preset').value
                    : '');
                $('frame').title = 'Preview of ' + cur.name;
                updateHint(empty);
                play();
            } catch (err) {
                $('code-out').textContent = 'Could not build this effect: ' + err.message;
                html = '';
            }
        }

        function play() {
            if (!html) return;
            nonce++;
            $('frame').srcdoc = html + '\n<!-- ' + nonce + ' -->';
        }

        function updateHint(empty, trimmed) {
            const h = $('hint'), n = $('text').value.length;
            h.classList.toggle('warn', !!trimmed);
            h.textContent = trimmed
                ? 'Text was trimmed to ' + MAX.toLocaleString() + ' characters to keep the preview fast.'
                : empty
                    ? 'Text is empty, so the placeholder is shown. Type to replace it.'
                    : n.toLocaleString() + ' / ' + MAX.toLocaleString() + ' characters';
        }

        function scheduleBuild() {
            clearTimeout(buildTimer);
            buildTimer = setTimeout(rebuild, DEBOUNCE);
        }

        function flushBuild() { if (buildTimer) rebuild(); }
        function replay() { if (buildTimer) rebuild(); else play(); }

        function onInput() {
            dirty = true;
            const ta = $('text');
            let trimmed = false;
            if (ta.value.length > MAX) {
                let v = ta.value.slice(0, MAX);
                if (/[\uD800-\uDBFF]$/.test(v)) v = v.slice(0, -1);
                ta.value = v;
                trimmed = true;
            }
            updateHint(!ta.value.trim(), trimmed);
            scheduleBuild();
        }

        function placeTextField(e) {
            const mode = e.field === 'none' ? 'none' : (e.cat === 'Cursor' ? 'slot' : 'controls');
            if (mode === 'slot') $('cslot').append($('tblock'));
            else if (mode === 'controls') $('controls').append($('tblock'));
            $('cslot').hidden = mode !== 'slot';
            $('ccard').hidden = mode !== 'controls';
            $('controls').classList.toggle('no-opts', !e.opts);
            $('tlabel').textContent = FIELD[e.id] || 'Text';
        }

        function selectEffect(e, fromUser) {
            cur = e;
            if (!dirty && e.field !== 'none') $('text').value = e.text || '';
            $('opts').hidden = !e.opts;
            placeTextField(e);
            updatePreviewHeight(e);
            $('pname').textContent = e.name;
            $('pcat').textContent = e.cat;
            $('pnote').textContent = e.note;
            $('nav').querySelectorAll('button[data-id]').forEach(b => {
                if (b.dataset.id === e.id) {
                    b.setAttribute('aria-current', 'true');
                    if (fromUser) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
                } else b.removeAttribute('aria-current');
            });
            rebuild();
            if (fromUser) {
                say('Showing ' + e.name +
                    (e.cat === 'Cursor' ? '. Its text field is below the preview.' : ''));
            }
        }

        CATS.forEach(c => {
            const list = EFFECTS.filter(e => e.cat === c);
            if (!list.length) return;

            const g = document.createElement('div');
            g.className = 'grp';
            g.setAttribute('role', 'group');
            g.setAttribute('aria-labelledby', 'gl-' + c);

            const h = document.createElement('button');
            h.type = 'button';
            h.className = 'gl';
            h.id = 'gl-' + c;
            h.setAttribute('aria-expanded', 'true');
            h.setAttribute('aria-controls', 'gitems-' + c);

            const chev = document.createElement('i');
            chev.className = 'ri-arrow-down-s-line gl-chev';
            chev.setAttribute('aria-hidden', 'true');

            const label = document.createElement('span');
            label.className = 'gl-label';
            label.textContent = c;

            const cnt = document.createElement('span');
            cnt.className = 'gl-count';
            cnt.textContent = list.length;
            cnt.setAttribute('aria-hidden', 'true');

            h.append(chev, label, cnt);

            const items = document.createElement('div');
            items.className = 'items';
            items.id = 'gitems-' + c;

            list.forEach(e => {
                const b = document.createElement('button');
                const n = document.createElement('span');
                b.type = 'button';
                b.dataset.id = e.id;
                n.className = 'nm';
                n.textContent = e.cat === 'Cursor' ? e.name.replace(/^Cursor:\s*/, '') : e.name;
                b.append(n);
                b.title = e.name + ' — ' + e.note;
                b.addEventListener('click', () => selectEffect(e, true));
                items.append(b);
            });

            h.addEventListener('click', () => {
                const collapsed = g.classList.toggle('collapsed');
                h.setAttribute('aria-expanded', String(!collapsed));
                chev.className = (collapsed ? 'ri-arrow-right-s-line' : 'ri-arrow-down-s-line') + ' gl-chev';
            });

            g.append(h, items);
            $('nav').append(g);
        });

        $('nav').addEventListener('keydown', ev => {
            const k = ev.key;
            const btns = Array.from($('nav').querySelectorAll('button[data-id]'))
                .filter(b => b.offsetParent !== null);
            let i = btns.indexOf(document.activeElement);
            if (i < 0) return;
            if (k === 'Home') i = 0;
            else if (k === 'End') i = btns.length - 1;
            else if (k === 'ArrowDown' || k === 'ArrowRight') i = (i + 1) % btns.length;
            else if (k === 'ArrowUp' || k === 'ArrowLeft') i = (i - 1 + btns.length) % btns.length;
            else return;
            ev.preventDefault();
            btns[i].focus();
        });

        const searchInput = $('searchInput');
        const sideEmpty = $('sideEmpty');

        function applySearch() {
            const q = searchInput.value.trim().toLowerCase();
            let anyTotal = 0;
            document.querySelectorAll('#nav .grp').forEach(grp => {
                let anyVisible = false;
                grp.querySelectorAll('button[data-id]').forEach(btn => {
                    const effect = EFFECTS.find(e => e.id === btn.dataset.id);
                    if (!effect) return;
                    const match = !q
                        || effect.name.toLowerCase().includes(q)
                        || effect.note.toLowerCase().includes(q)
                        || effect.cat.toLowerCase().includes(q);
                    btn.style.display = match ? '' : 'none';
                    if (match) anyVisible = true;
                });
                grp.style.display = anyVisible ? '' : 'none';
                if (anyVisible) anyTotal++;

                if (q && anyVisible) {
                    grp.classList.remove('collapsed');
                    const head = grp.querySelector('.gl');
                    const chev = grp.querySelector('.gl-chev');
                    if (head) head.setAttribute('aria-expanded', 'true');
                    if (chev) chev.className = 'ri-arrow-down-s-line gl-chev';
                }
            });
            sideEmpty.classList.toggle('show', anyTotal === 0 && !!q);
        }

        searchInput.addEventListener('input', applySearch);
        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                applySearch();
                searchInput.blur();
                
            }
        });

        document.addEventListener('keydown', e => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if (searchInput.offsetParent !== null) {
                    searchInput.focus();
                    searchInput.select();
                }
            }
        });

        const themeToggle = $('themeToggle');
        const themeIcon = $('themeIcon');

        function applyThemeIcon() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            themeIcon.className = current === 'light' ? 'ri-moon-line' : 'ri-sun-line';
            themeToggle.setAttribute('aria-label',
                current === 'light' ? 'Switch to dark theme' : 'Switch to light theme');
            themeToggle.title = current === 'light' ? 'Switch to dark theme' : 'Switch to light theme';
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', current === 'light' ? '#f7f8fb' : '#0c0e12');
        }

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('ziiui-theme', next); } catch (_) {}
            applyThemeIcon();
        });

        applyThemeIcon();

        function legacyCopy(s) {
            const prev = document.activeElement;
            const ta = document.createElement('textarea');
            ta.value = s;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
            document.body.appendChild(ta);
            let ok = false;
            try {
                ta.select();
                ta.setSelectionRange(0, s.length);
                ok = document.execCommand('copy');
            } catch (_) { ok = false; }
            ta.remove();
            if (prev && prev.focus) prev.focus();
            return ok;
        }

        async function copyText(s) {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(s);
                    return true;
                } catch (_) {}
            }
            return legacyCopy(s);
        }

        async function onCopy() {
            if (copyBusy) return;
            flushBuild();
            if (!html) return;
            copyBusy = true;
            const btn = $('copy');
            const ok = await copyText(html);
            btn.textContent = ok ? 'Copied!' : 'Copy failed';
            btn.dataset.state = ok ? 'ok' : 'fail';
            say(ok ? 'Code copied to clipboard' : 'Copy failed. Select the code and copy it manually.');
            clearTimeout(copyReset);
            copyReset = setTimeout(() => {
                btn.textContent = 'Copy code';
                delete btn.dataset.state;
                copyBusy = false;
            }, 1800);
        }

        ['per', 'preset'].forEach(id => $(id).addEventListener('change', rebuild));
        $('text').addEventListener('input', onInput);
        $('replay').addEventListener('click', replay);
        $('copy').addEventListener('click', onCopy);

        selectEffect(EFFECTS[0], false);
    </script>
